<!DOCTYPE html>

<html>

<head>
    <title>Grid Practice 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        .main {
            height: 100%;
            width: 100%;
            padding: 50px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .border {
            border: 3px solid #212121;
        }

        .red {
            background-color: darkred;
        }

        .green {
            background-color: green;
        }

        .yellow {
            background-color: darkgoldenrod;
        }

        .upperBody {
            height: 50%;
            width: 90%;
            background-color: rgb(59, 59, 87);
            display: flex;
            align-items: center;
            gap: .7rem;
            padding: 1px 3px;
        }

        .lowerBody {
            height: 50%;
            width: 90%;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            border: 3px solid grey;
        }

        .left {
            height: 100%;
            width: 20%;
            background-color: green;
        }

        .mid {
            height: 100%;
            width: 60%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .7rem;
        }

        .right {
            width: 20%;
            height: 100%;
            display: grid;
            grid-template-rows: 20% 1fr;
            gap: .7rem;
        }

        .upper {
            height: 20%;
            width: 100%;
            background-color: green;
        }

        .lower {
            height: 80%;
            width: 100%;
            display: grid;
            grid-template-columns: 50% 1fr;
            grid-template-rows: 50% 1fr;
            gap: .7rem;
        }

        .header {
            width: 100%;
            height: 20%;
            background-color: skyblue;
            display: flex;
            align-items: center;
            padding: 25px;
        }

        .text {
            color: white;
            font-size: large;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .content {
            width: 100%;
            height: 60%;
            padding: 0px 20%;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .main-content {
            background-color: green;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70%;
            height: 100%;

        }

        .sidebar {
            background-color: purple;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30%;
            height: 100%;

        }

        .twin {
            background-color: orange;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        .upper2 {
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
        }

        .lower2 {
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
        }

        .footer {
            width: 100%;
            height: 20%;
            background-color: darkblue;
            display: flex;
            align-items: center;
            padding: 25px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="upperBody">
            <div class="left border"></div>
            <div class="mid">
                <div class="upper border"></div>
                <div class="lower">
                    <div class="border yellow"></div>
                    <div class="border red"></div>
                    <div class="border red"></div>
                    <div class="border yellow"></div>
                </div>
            </div>
            <div class="right">
                <div class="border red"></div>
                <div class="border green"></div>
            </div>
        </div> <br>

        <div class="lowerBody">
            <div class="header text">.header</div>
            <div class="content text">
                <div class="upper2">
                    <div class="main-content text">.main-content</div>
                    <div class="sidebar text">.sidebar</div>
                </div>
                <div class="lower2">
                    <div class="twin text">.twin</div>
                    <div class="twin text">.twin</div>
                </div>
            </div>
            <div class="footer text">.footer</div>
        </div>
    </div>
</body>

</html>
