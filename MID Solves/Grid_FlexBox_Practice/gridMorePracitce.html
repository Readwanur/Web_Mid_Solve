<!DOCTYPE html>
<html>

<head>
    <title>grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .items {
            background-color: #fff;
            border-radius: 8px;
        }

        .items:nth-child(1) {
            grid-column: 1/3;
            height: fit-content;
            background-color: rgb(201, 232, 245);
        }
        .items:last-child {
            grid-column: 3;
            grid-row:1/3;
            padding: 3%;
            height: fit-content;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2.5em;
        }
        button{
            background-color: #212121;
            color: white;
            font-weight: bold;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-weight: bolder;
            cursor: pointer;
        }
        .drag{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dotted gray;
            padding: 25px;
            border-radius: 8px;
        }

        .main {
            height: 100%;
            width: 100%;
            background-color: rgb(201, 232, 245);
            display: grid;
            gap: 1em;
            padding: 150px;
            grid-template-columns: 1fr 1fr 350px;
            grid-template-rows: auto 1fr 1fr;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="items">
            <h2>Draft Courses</h2>
        </div>
        <div class="items">card1</div>
        <div class="items">card2</div>
        <div class="items">card3</div>
        <div class="items">card4</div>
        <div class="items">
            <h2>Quick upload</h2>
            <div class="drag">
                <h3>Drag & Drop videos here</h3>
                <p>MP4,MOV up to 2GB</p>
            </div>
            <button>Browse Files</button>
        </div>
    </div>
</body>

</html>
