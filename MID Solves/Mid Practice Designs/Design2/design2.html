<!DOCTYPE html>

<html>

<head>
    <title>Design2</title>
    <link rel="stylesheet" href="design2.css">
</head>

<body>
    <div class="main">

        <div class="content">
            <div class="header">
                <h2>GearRent</h2>
                <input type="search" name="" id="search" placeholder="Search gadgets...">
                <span class="logo">JS</span>
            </div>
            <div class="main-content">
                <div class="card-slot">
                    <div class="card-grey">
                        <h3>MacBook Pro M2</h3>
                        <span class="logo pricing">$40/day</span>
                    </div>
                    <div class="card-grey blue">
                        <h3>Sony A7III Camera</h3>
                        <span class="logo pricing">$35/day</span>
                    </div>
                    <div class="card-grey">
                        <h3>IPad pro 12.9"</h3>
                        <span class="logo pricing">$20/day</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="navBar">
            <div>
                <h2 style="border-bottom: 2px solid rgb(32, 29, 29);">Your Rental</h2>
                <p style="font-size: medium;">Subtotal: $0.00</p>
            </div>
            <button>Checkout</button>
        </div>
    </div>
</body>

</html>
