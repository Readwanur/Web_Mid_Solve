<!doctype html>

<html>
  <head>
    <title>Design5</title>
    <link rel="stylesheet" href="design5.css" />
  </head>
  <body>
    <div class="main">
      <div class="header">
        <h1>CreatorStudio</h1>
        <input
          class="search"
          type="search"
          name=""
          id=""
          placeholder="Search courses..."
        />
        <span class="logo">MK</span>
      </div>
      <div class="content">
        <h2>Draft Courses</h2>
        <div class="cards">
          <div class="item">
            <div class="graphic"></div>
            <div class="info">
              <h3>Intro to Python</h3>
              <span class="timing">1h 45min</span>
              <button>Edit Course</button>
            </div>
          </div>
          <div class="item">
            <div class="graphic orange"></div>
            <div class="info">
              <h3>Advanced CSS</h3>
              <span class="timing">3h 20min</span>
              <button>Edit Course</button>
            </div>
          </div>
          <div class="item extra">
            <h3>Quick Upload</h3>
            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border: 2px dotted grey;
                padding: 3em 2em;
                border-radius: 8px;
                background-color: rgb(223, 223, 223);
              "
            >
              <h3>Drag & Drop video here</h3>
              <p>MP4,MOV up to 2GB</p>
            </div>
            <button>Browse Files</button>
          </div>
          <div class="item">
            <div class="graphic cyan"></div>
            <div class="info">
              <h3>UI Design Basics</h3>
              <span class="timing">2h 00min</span>
              <button>Edit Course</button>
            </div>
          </div>
          <div class="item">
            <div class="graphic blue"></div>
            <div class="info">
              <h3>React Hooks</h3>
              <span class="timing">4h 10min</span>
              <button>Edit Course</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
