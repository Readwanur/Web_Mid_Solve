<!DOCTYPE html>

<html>

<head>
    <title>Design3</title>
    <link rel="stylesheet" href="design3.css">
</head>

                </div>
                <div class="cards" id="status">

                        <h3>Quiet Zone 1</h3>

                </div>
            </div>
